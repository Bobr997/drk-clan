<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRK CLAN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f13; --card-bg: rgba(255, 255, 255, 0.05); --accent: #00d2ff; --danger: #ff4757; --text: #ffffff; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg); background-image: radial-gradient(circle at top right, #1a1a2e, #0f0f13); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; }
        h1 { font-family: 'Orbitron', sans-serif; text-align: center; font-size: 22px; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 15px rgba(0, 210, 255, 0.5); margin-bottom: 25px; }
        .add-btn { background: linear-gradient(135deg, #0088cc, #00d2ff); color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; font-family: 'Orbitron', sans-serif; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3); margin-bottom: 30px; }
        .card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; }
        .avatar-container { width: 70px; height: 70px; margin-right: 15px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; border-radius: 15px; background: #222; border: 2px solid var(--accent); object-fit: cover; }
        .info { flex-grow: 1; min-width: 0; }
        .nick { font-family: 'Orbitron', sans-serif; font-size: 16px; margin-bottom: 2px; }
        .tg { color: #888; font-size: 13px; margin-bottom: 8px; display: block; }
        .ranks-container { display: flex; flex-wrap: wrap; gap: 5px; }
        .rank-tag { background: rgba(0, 210, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 10px; text-transform: uppercase; font-weight: bold; cursor: pointer; }
        .controls { display: flex; flex-direction: column; gap: 5px; margin-left: 10px; }
        .btn-small { border: none; border-radius: 8px; padding: 6px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .btn-rank { background: #2f3542; color: #a4b0be; }
        .btn-del { background: rgba(255, 71, 87, 0.2); color: var(--danger); }
    </style>
</head>
<body>

    <h1>DRK CLAN</h1>
    <button class="add-btn" id="addMemberBtn">➕ ДОБАВИТЬ УЧАСТНИКА</button>
    <div id="clanList"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let members = [];
        const saved = localStorage.getItem('drk_clan_final');
        if (saved) { members = JSON.parse(saved); }

        function save() { localStorage.setItem('drk_clan_final', JSON.stringify(members)); }

        function getRobloxId(url) {
            const match = url.match(/users\/(\d+)/);
            return match ? match[1] : "1";
        }

        function render() {
            const list = document.getElementById('clanList');
            list.innerHTML = '';
            members.forEach((m, i) => {
                const rid = getRobloxId(m.profileUrl);
                // Используем прокси для загрузки аватара
                const proxyUrl = `https://cdn.statically.io/img/www.roblox.com/headshot-thumbnail/image?userId=${rid}&width=150&height=150&format=png`;

                list.innerHTML += `
                    <div class="card">
                        <div class="avatar-container">
                            <img src="${proxyUrl}" class="avatar" onerror="this.src='https://tr.rbxcdn.com/38c6edcf0663309a47348981452a8187/150/150/AvatarHeadshot/Png'">
                        </div>
                        <div class="info">
                            <span class="nick">${m.robloxNick}</span>
                            <span class="tg">${m.tgUser}</span>
                            <div class="ranks-container">
                                ${m.ranks.map((r, ri) => `<span class="rank-tag" onclick="removeRank(${i}, ${ri})">${r} ✕</span>`).join('')}
                            </div>
                        </div>
                        <div class="controls">
                            <button class="btn-small btn-rank" onclick="addRank(${i})">+ Ранг</button>
                            <button class="btn-small btn-del" onclick="removeMember(${i})">Удалить</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('addMemberBtn').onclick = () => {
            const url = prompt("Ссылка на профиль Roblox:");
            const nick = prompt("Ник в Roblox:");
            const tgNick = prompt("Юзернейм в Телеграм:");
            if(url && nick && tgNick) {
                members.push({ profileUrl: url, robloxNick: nick, tgUser: tgNick, ranks: [] });
                save();
                render();
            }
        };

        window.removeMember = (idx) => { if(confirm("Удалить?")) { members.splice(idx, 1); save(); render(); } };
        window.addRank = (idx) => { const r = prompt("Название ранга:"); if(r) { members[idx].ranks.push(r); save(); render(); } };
        window.removeRank = (mi, ri) => { if(confirm("Убрать?")) { members[mi].ranks.splice(ri, 1); save(); render(); } };

        render();
    </script>
</body>
</html>
