<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRK CLAN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f13; --card-bg: rgba(255, 255, 255, 0.05); --accent: #00d2ff; --danger: #ff4757; --text: #ffffff; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg); background-image: radial-gradient(circle at top right, #1a1a2e, #0f0f13); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; }
        h1 { font-family: 'Orbitron', sans-serif; text-align: center; font-size: 22px; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 15px rgba(0, 210, 255, 0.5); margin-bottom: 25px; }
        .add-btn { background: linear-gradient(135deg, #0088cc, #00d2ff); color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; font-family: 'Orbitron', sans-serif; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3); margin-bottom: 30px; transition: 0.3s; }
        .add-btn:active { transform: scale(0.98); }
        .card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar-container { position: relative; width: 70px; height: 70px; margin-right: 15px; }
        .avatar { width: 100%; height: 100%; border-radius: 15px; background: #222; border: 2px solid var(--accent); object-fit: cover; }
        .info { flex-grow: 1; }
        .nick { font-family: 'Orbitron', sans-serif; font-size: 16px; margin-bottom: 2px; }
        .tg { color: #888; font-size: 13px; margin-bottom: 8px; display: block; }
        .ranks-container { display: flex; flex-wrap: wrap; gap: 5px; }
        .rank-tag { background: rgba(0, 210, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 10px; text-transform: uppercase; font-weight: bold; cursor: pointer; }
        .controls { display: flex; flex-direction: column; gap: 5px; margin-left: 10px; }
        .btn-small { border: none; border-radius: 8px; padding: 6px; font-size: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-rank { background: #2f3542; color: #a4b0be; }
        .btn-del { background: rgba(255, 71, 87, 0.2); color: var(--danger); }
    </style>
</head>
<body>

    <h1>DRK CLAN</h1>
    <button class="add-btn" id="addMemberBtn">➕ ДОБАВИТЬ УЧАСТНИКА</button>
    <div id="clanList"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let members = [];

        function getRobloxId(url) {
            const match = url.match(/users\/(\d+)/);
            return match ? match[1] : "1";
        }

        function render() {
            const list = document.getElementById('clanList');
            list.innerHTML = '';
            members.forEach((m, mIndex) => {
                const robloxId = getRobloxId(m.profileUrl);
                const avatarUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${robloxId}&size=150x150&format=Png&isCircular=false`;
                const imgId = `img-${mIndex}`;
                
                fetch(avatarUrl).then(res => res.json()).then(data => {
                    if(data.data && data.data[0]) document.getElementById(imgId).src = data.data[0].imageUrl;
                });

                list.innerHTML += `
                    <div class="card">
                        <div class="avatar-container">
                            <img src="https://tr.rbxcdn.com/38c6edcf0663309a47348981452a8187/150/150/AvatarHeadshot/Png" id="${imgId}" class="avatar">
                        </div>
                        <div class="info">
                            <span class="nick">${m.robloxNick}</span>
                            <span class="tg">${m.tgUser}</span>
                            <div class="ranks-container">
                                ${m.ranks.map((r, rIndex) => `<span class="rank-tag" onclick="removeRank(${mIndex}, ${rIndex})" title="Нажми, чтобы убрать"> ${r} ✕</span>`).join('')}
                            </div>
                        </div>
                        <div class="controls">
                            <button class="btn-small btn-rank" onclick="addRank(${mIndex})">+ Ранг</button>
                            <button class="btn-small btn-del" onclick="removeMember(${mIndex})">Удалить</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('addMemberBtn').onclick = () => {
            const url = prompt("Ссылка на профиль Roblox:");
            if(!url) return;
            const nick = prompt("Ник в Roblox:");
            const tgNick = prompt("Юзернейм в Телеграм (с @):");
            if(url && nick && tgNick) {
                members.push({ profileUrl: url, robloxNick: nick, tgUser: tgNick, ranks: [] });
                render();
            }
        };

        window.removeMember = (index) => {
            if(confirm("Изгнать участника из клана?")) {
                members.splice(index, 1);
                render();
            }
        };

        window.addRank = (index) => {
            const r = prompt("Название ранга:");
            if(r) { members[index].ranks.push(r); render(); }
        };

        window.removeRank = (mIndex, rIndex) => {
            if(confirm("Убрать этот ранг?")) {
                members[mIndex].ranks.splice(rIndex, 1);
                render();
            }
        };

        render();
    </script>
</body>
</html>
